name: Docker CI/CD Pipeline

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: rahulf121/devops_projects

jobs:

# --------------------
# Stage 1 - Build
# --------------------
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docker_projects

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME .

# --------------------
# Stage 2 - Test
# --------------------
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Run Test
        run: echo "Basic test passed"

# --------------------
# Stage 3 - Docker Login
# --------------------
  login:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

# --------------------
# Stage 4 - Push
# --------------------
  push:
    needs: login
    runs-on: ubuntu-latest

    steps:

      - name: Push Docker Image
        run: docker push $IMAGE_NAME

# --------------------
# Stage 5 - Deploy
# --------------------
  deploy:
    needs: push
    runs-on: ubuntu-latest

    steps:

      - name: Run Container
        run: docker run -d -p 5000:5000 $IMAGE_NAME