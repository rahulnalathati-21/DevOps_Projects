name: Docker CI Pipeline

on:
  push:
    branches: ["main"]

jobs:

  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docker_projects

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt


  test:
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: docker_projects

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Tests
        run: echo "Running basic tests..."


  docker-build:
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: docker_projects

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t python-image-cicd .


  docker-run:
    runs-on: ubuntu-latest
    needs: docker-build

    defaults:
      run:
        working-directory: docker_projects

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Docker Container
        run: docker run -d -p 5000:5000 python-image-cicd